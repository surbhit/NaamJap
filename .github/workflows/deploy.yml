name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.47.4'
        channel: 'stable'
        cache: true
        
    - name: Install dependencies
      run: flutter pub get
      
    - name: Verify Flutter installation
      run: flutter doctor -v
      
    # --pwa-strategy=none avoids aggressive service-worker caching so new deploys
    # are visible without users clearing site data.
    - name: Build Flutter web
      run: flutter build web --release --verbose --pwa-strategy=none
      
    - name: Add CNAME file
      run: echo "www.ramchandrasolutions.com" > build/web/CNAME

    # The previous Flutter service worker keeps serving the old app. Replace it
    # with one that drops those caches and reloads from the network.
    - name: Replace cached service worker
      run: |
        cat > build/web/flutter_service_worker.js << 'EOF'
        self.addEventListener('install', (event) => {
          self.skipWaiting();
        });
        self.addEventListener('activate', (event) => {
          event.waitUntil((async () => {
            const keys = await caches.keys();
            await Promise.all(keys.map((key) => caches.delete(key)));
            await self.clients.claim();
            const windows = await self.clients.matchAll({type: 'window'});
            await Promise.all(windows.map((client) => client.navigate(client.url)));
          })());
        });
        self.addEventListener('fetch', (event) => {
          const path = new URL(event.request.url).pathname;
          const fresh = event.request.mode === 'navigate'
            || path.endsWith('/main.dart.js')
            || path.endsWith('/flutter_bootstrap.js')
            || path.endsWith('/index.html');
          if (!fresh) return;
          event.respondWith(fetch(event.request, {cache: 'reload'}));
        });
        EOF

    - name: Cache-bust the Flutter entry files
      run: |
        VERSION="$(git rev-parse --short HEAD)"
        sed -i "s|flutter_bootstrap.js|flutter_bootstrap.js?v=${VERSION}|g" build/web/index.html
        sed -i "s|mainJsPath\":\"main.dart.js\"|mainJsPath\":\"main.dart.js?v=${VERSION}\"|" build/web/flutter_bootstrap.js
        mkdir -p build/web/naamjap
        printf '%s\n' "<!DOCTYPE html><html><head><meta charset=\"utf-8\"><title>Naam Jap</title><link rel=\"canonical\" href=\"https://www.ramchandrasolutions.com/#/naamjap\"><meta http-equiv=\"refresh\" content=\"0;url=/?v=${VERSION}#/naamjap\"><script>location.replace('/?v=${VERSION}#/naamjap');</script></head><body></body></html>" > build/web/naamjap/index.html
      
    - name: List build directory contents
      run: ls -la build/web/
      
    - name: Verify index.html exists
      run: test -f build/web/index.html && echo "index.html found" || echo "index.html missing"
      
    - name: Setup Pages
      uses: actions/configure-pages@v4
      if: github.ref == 'refs/heads/main'
      
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      if: github.ref == 'refs/heads/main'
      with:
        path: './build/web'
        
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
      if: github.ref == 'refs/heads/main'
