name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.47.4'
        channel: 'stable'
        cache: true
        
    - name: Install dependencies
      run: flutter pub get
      
    - name: Verify Flutter installation
      run: flutter doctor -v
      
    # --pwa-strategy=none avoids aggressive service-worker caching so new deploys
    # are visible without users clearing site data.
    - name: Build Flutter web
      run: flutter build web --release --verbose --pwa-strategy=none
      
    - name: Add CNAME file
      run: echo "www.ramchandrasolutions.com" > build/web/CNAME

    - name: Add clean URL for the chanting page
      run: |
        mkdir -p build/web/naamjap
        printf '%s\n' '<!DOCTYPE html><html><head><meta charset="utf-8"><title>Naam Jap</title><link rel="canonical" href="https://www.ramchandrasolutions.com/#/naamjap"><meta http-equiv="refresh" content="0;url=/#/naamjap"><script>location.replace("/#/naamjap");</script></head><body></body></html>' > build/web/naamjap/index.html
      
    - name: List build directory contents
      run: ls -la build/web/
      
    - name: Verify index.html exists
      run: test -f build/web/index.html && echo "index.html found" || echo "index.html missing"
      
    - name: Setup Pages
      uses: actions/configure-pages@v4
      if: github.ref == 'refs/heads/main'
      
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      if: github.ref == 'refs/heads/main'
      with:
        path: './build/web'
        
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
      if: github.ref == 'refs/heads/main'
